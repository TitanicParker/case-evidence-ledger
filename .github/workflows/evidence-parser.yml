name: Evidence parser gate

on:
  pull_request:
    paths:
      - 'scripts/build_evidence_graph.py'
      - 'scripts/evidence_graph_impl.py'
      - 'tests/**'
      - 'docs/PARSER_AND_VALIDATOR.md'
      - 'schema/**'
      - '*.md'
      - 'site-data/generated/**'
      - '.github/workflows/evidence-parser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parser-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run parser tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate evidence graph without writes
        run: python scripts/build_evidence_graph.py --validate

      - name: Build derived artifacts
        run: python scripts/build_evidence_graph.py --build

      - name: Commit generated artifacts on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git add site-data/generated PARSER_VALIDATION_REPORT.md
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update generated evidence graph artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check committed generated artifacts are current
        shell: bash
        run: |
          git diff --exit-code -- site-data/generated PARSER_VALIDATION_REPORT.md
          untracked="$(git ls-files --others --exclude-standard -- site-data/generated PARSER_VALIDATION_REPORT.md)"
          if [ -n "$untracked" ]; then
            echo "Generated artifacts are not committed:"
            echo "$untracked"
            exit 1
          fi

      - name: Upload parser gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-parser-gate
          path: |
            site-data/generated/
            PARSER_VALIDATION_REPORT.md
          if-no-files-found: warn
