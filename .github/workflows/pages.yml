name: Deploy Evidence Foundation to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'site-data/generated/**'
      - 'schema/**'
      - 'scripts/build_evidence_graph.py'
      - 'scripts/evidence_graph_impl.py'
      - 'scripts/check_evidence_site.py'
      - 'scripts/check_evidence_search.py'
      - 'package.json'
      - '.eleventy.js'
      - '.github/workflows/pages.yml'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Run parser tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate evidence graph
        run: python scripts/build_evidence_graph.py --validate

      - name: Build evidence graph
        run: python scripts/build_evidence_graph.py --build

      - name: Verify generated graph is current
        run: git diff --exit-code -- site-data/generated PARSER_VALIDATION_REPORT.md

      - name: Install site dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build production project-Pages site
        env:
          SITE_BASE_PATH: /case-evidence-ledger/
          SITE_OUTPUT_DIR: _site
        run: |
          npm run build
          npm run search:index
          python scripts/check_evidence_site.py
          python scripts/check_evidence_search.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
