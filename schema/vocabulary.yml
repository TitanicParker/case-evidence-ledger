schema_version: 1.0.0-draft
status: proposed
purpose: >-
  Controlled classificatory vocabulary for evidence-object parsing, validation,
  retrieval, and generated GitHub Pages views. Values classify existing controlled
  objects; they do not replace substantive evidence text or explicit ID relationships.

object_type:
  - source_euid
  - fact
  - tension
  - proposition
  - supporting_proposition
  - control_rule
  - argument_stage
  - defence_audit
  - adjudication
  - expert_question

audience:
  - expert
  - counsel
  - governance
  - foundation

topic:
  - entry-state
  - structural-foot
  - movement-phenotype
  - treatment-state
  - medication-strategy
  - genetics
  - administrative-state
  - knowledge-state
  - representation
  - document-finalisation
  - provenance
  - chronology
  - missing-evidence
  - reconstruction

expert_dependency:
  - none
  - contextual
  - required

proposition_strength:
  - direct-documentary
  - near-direct-documentary-inference
  - strong-documentary-inference
  - qualified-documentary-inference

resolution_status:
  - unresolved
  - partially-reconcilable
  - requires-additional-source
  - requires-expert-evidence
  - resolved-on-current-record

adjudication_class:
  A:
    slug: defeat-or-amend
    label: Defeats / requires amendment
  B:
    slug: material-qualification
    label: Material qualification
  C:
    slug: coexists-but-does-not-answer
    label: Coexists but does not answer
  D:
    slug: requires-expert-adjudication
    label: Requires expert adjudication

source_status:
  - controlling-native-or-public-representation
  - controlled-derived-corpus
  - original-contemporaneous
  - later-reproduction
  - retrospective-account
  - provenance-metadata
  - unmapped

statement_status:
  - source-text
  - objective-recorded-fact
  - contemporaneous-patient-report
  - clinician-observation
  - clinical-opinion-or-assessment
  - administrative-act-or-classification
  - retrospective-clinician-account
  - retrospective-patient-account
  - documentary-inference

source_type:
  - gp-clinical-record
  - hospital-clinical-record
  - discharge-or-admission-record
  - specialist-correspondence
  - podiatry-record
  - prescribing-record
  - medication-administration-record
  - administrative-record
  - occupational-health-record
  - genetic-record
  - imaging-or-investigation-record
  - complaint-or-governance-record
  - patient-statement
  - source-provenance-record
  - other-controlled-source

tension_type:
  - reasoning-gap
  - operational-epistemic-mismatch
  - representation-reasoning-tension
  - documentary-mixed-mechanism
  - administrative-clinical-mismatch
  - management-persistence
  - temporal-tension
  - epistemic-management-tension
  - treatment-state-tension
  - representation-tension
  - provenance-or-finalisation-tension
  - other-controlled-tension

defence_position:
  - accept
  - accept-but-neutralise
  - dispute
  - partially-accept
  - requires-expert-evidence

expert_question_status:
  - open
  - instructed
  - answered
  - superseded

expert_domain:
  - movement-disorders-neurology
  - neurology
  - genetics
  - podiatry
  - pain-medicine
  - pharmacology
  - records-governance
  - other

temporal_field:
  - event_date
  - document_date
  - recorded_date
  - finalised_date
  - received_date

relationship_key:
  - source_euids
  - fact_ids
  - tension_ids
  - proposition_ids
  - supporting_proposition_ids
  - control_rule_ids
  - argument_stage_refs
  - defence_audit_refs
  - adjudication_refs
  - expert_question_ids

validation_policy:
  unknown_controlled_value: error
  duplicate_controlled_id: error
  malformed_controlled_id: error
  unresolved_required_reference: error
  proposition_without_boundary: error
  duplicate_canonical_url: error
  missing_optional_provenance: warning
  orphan_fact: warning
  orphan_tension: warning
  unresolved_noncanonical_source_identifier: warning

notes:
  - Audience and topic values are retrieval metadata only.
  - Topics must never substitute for explicit Fact/Tension/Proposition relationships.
  - A generated view must preserve Fact qualification, Proposition boundary, and material adjudication/disposition.
  - Source, Fact, Tension, Proposition, Audit, and Adjudication content must remain visibly distinguishable in search and UI.
  - Additional controlled values require schema review; do not introduce free-form tags in production metadata.
