schema_version: 1.0.0
status: frozen
purpose: >-
  Controlled classificatory vocabulary for evidence-object parsing, validation,
  retrieval, and generated GitHub Pages views. Values classify existing controlled
  objects; they do not replace substantive evidence text or explicit ID relationships.

object_type:
  - source_euid
  - fact
  - tension
  - proposition
  - supporting_proposition
  - control_rule
  - argument_stage
  - defence_audit
  - adjudication
  - expert_question

id_kind:
  - evidential
  - implementation

audience:
  - expert
  - counsel
  - governance
  - foundation

topic:
  - entry-state
  - structural-foot
  - movement-phenotype
  - treatment-state
  - medication-strategy
  - genetics
  - administrative-state
  - knowledge-state
  - representation
  - document-finalisation
  - provenance
  - chronology
  - missing-evidence
  - reconstruction

expert_dependency:
  - none
  - contextual
  - required

proposition_strength:
  - direct-documentary
  - near-direct-documentary-inference
  - strong-documentary-inference
  - qualified-documentary-inference

# Normalized values preserve the meaning of the controlled source labels below.
resolution_status:
  - unresolved
  - partially-reconcilable
  - requires-additional-source
  - requires-expert-evidence
  - resolved-by-record
  - representation-issue-only

resolution_status_source_map:
  "UNRESOLVED": unresolved
  "PARTIALLY RECONCILABLE": partially-reconcilable
  "REQUIRES ADDITIONAL SOURCE": requires-additional-source
  "REQUIRES EXPERT EVIDENCE": requires-expert-evidence
  "RESOLVED BY RECORD": resolved-by-record
  "REPRESENTATION ISSUE ONLY": representation-issue-only

adjudication_class:
  A:
    slug: defeat-or-amend
    label: Defeats / requires amendment
  B:
    slug: material-qualification
    label: Material qualification
  C:
    slug: coexists-but-does-not-answer
    label: Coexists but does not answer
  D:
    slug: requires-expert-adjudication
    label: Requires expert adjudication

source_status:
